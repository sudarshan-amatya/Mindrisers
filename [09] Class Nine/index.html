<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .button-up {
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 0, 0, 0.816);
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        .up-button {
            color: white;
            filter: brightness(0) invert(1);
        }
    </style>
</head>

<body>
    <div class="button-up">
        <img src="./hand-finger.svg" class="up-button" alt="up button">
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- === CSS === --.>
    <link rel="stylesheet" href="style.css.">

    <!-- === Boxicons Icons === -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>
    <section class="container forms">
        <div class="form login">
            <div class="form-content">
                <header>Login</header>
                <form action="">
                    <div class="field input-field">
                        <input type="email" class="input" placeholder="Email">
                    </div>
                    <div class="field input-field">
                        <input type="password" class="password" placeholder="Password">
                        <i class='bx bx-hide eye-icon'></i>
                    </div>
                    <div class="form-link">
                        <a href="#" class="forgot-pass">Forgot Password</a>
                    </div>
                    <div class="field button-field">
                        <button>Login</button>
                    </div>
                </form>
                <div class="form-link">
                    <span>
                        Don't have an account? <a href="./signup.html" class="signup-link">Signup</a>
                    </span>
                </div>
            </div>
            <div class="line"></div>
            <div class="media-options">
                <a href="#" class="field facebook"><i class='bx bxl-facebook facebook-icon'></i>
                <span>Login with Facebook</span></a>
            </div>
            <div class="media-options">
                <a href="#" class="field google"><img src="./images/google-removebg-preview.png" alt="google" class="google-img">
                <span>Login with Google</span></a>
            </div>
        </div>
    </section>
    <!-- === JavaScript === -->
    <script src="script.js"></script>
</body>

</html>

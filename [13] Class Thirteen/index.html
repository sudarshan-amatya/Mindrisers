<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo-container"> 
                <img src="./imgs/logo.png" class="logo-icon" alt="logo icon">
                <p class="logo-title">Lasles<span>VPN</span></p>
            </a>
            <i class='bx bx-menu menu-icon'></i>
            <div class="nav-link-container">
                <a href="#" class="logo-container"> <img src="./imgs/logo.png" class="logo-icon" alt="logo icon">
                    <p class="logo-title">Lasles<span>VPN</span></p>
                </a>
                <ul class="nav-links">
                    <li class="nav-link"><a href="#">About</a></li>
                    <li class="nav-link"><a href="#">Features</a></li>
                    <li class="nav-link"><a href="#">Pricing</a></li>
                    <li class="nav-link"><a href="#">Testimonials</a></li>
                    <li class="nav-link"><a href="#">Help</a></li>
                </ul>
                <div class="nav-sign-links">
                    <a href="#" class="sign-in">Sign In</a>
                    <a href="#" class="sign-up">Sign Up</a>
                </div>
                <i class='bx bx-x close-menu'></i>
            </div>
        </nav>
    </header>
    <script>
        let nav = document.querySelector(".nav-link-container")
        let menuClose = document.querySelector(".close-menu")
        let menuOpen = document.querySelector(".menu-icon")
        menuOpen.addEventListener("click", () => {
            nav.classList.toggle("active");

        })
        menuClose.addEventListener("click", () => {
            nav.classList.toggle("active");
        })
    </script>
</body>

</html>
